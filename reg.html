<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Reward | REWARDX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reg.css">
</head>
<body>

    <div class="form-wrapper">
        <a href="index.html" class="back-link">← Back to Event Page</a>

        <div class="form-card">
            <h2>Verify Your Profile</h2>
            <p>Enter your details and Dojo points to unlock your reward.</p>
            
            <form action="#" method="POST">
                
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>
                
                <div class="input-group">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="input-group">
                    <label for="class">Batch</label>
                    <input type="text" id="class" placeholder="e.g. BCA 1st Year" required>
                </div>

                <div class="input-group">
                    <label for="dojo">Class Dojo Points Earned</label>
                    <input type="number" id="dojo" placeholder="e.g. 500" min="0" required>
                </div>

                <button type="submit" class="btn-submit">Submit & Verify</button>
            </form>
        </div>
    </div>

</body>
</html>
